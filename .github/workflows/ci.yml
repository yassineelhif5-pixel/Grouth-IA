name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  database:
    name: Schema drift, migrations, RLS, isolation & traceability (SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: growth_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/growth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generated schema is up to date
        run: python database/schema/generate.py && git diff --exit-code -- database backend/apps docs/database
      - name: Apply migrations twice (idempotency) + SQL tests
        run: |
          infrastructure/scripts/db_local.sh
          infrastructure/scripts/db_local.sh --tests 2>&1 | tee sql-tests.log
          grep -q "ALL SQL TESTS PASSED" sql-tests.log && grep -q "ALL PROMPT2 SQL TESTS PASSED" sql-tests.log

  backend:
    name: Backend lint, types, security, tests
    runs-on: ubuntu-latest
    needs: database
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: growth_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "true"
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_NAME: growth_test
      DB_TEST_NAME: growth_test
      DB_SSLMODE: disable
      SUPABASE_URL: http://supabase.test
      SUPABASE_ANON_KEY: ci
      SUPABASE_JWT_SECRET: ci-jwt-secret-with-enough-length-0123456789
      REDIS_URL: redis://localhost:6379/0
      PILOT_REQUIRE_MFA: "true"
      PGURL: postgresql://postgres:postgres@localhost:5432/growth_test
      DB_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/growth_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: mypy apps config || true   # informational until django-stubs coverage is complete
      # B608 reviewed: SQL identifiers come from internal whitelists/constants, all values are bound parameters
      - run: bandit -q -r apps config -x tests -s B608
      - run: pip-audit -r requirements/base.txt
      - name: Prepare database (Supabase emulation + migrations) and Django migrate
        run: |
          ../infrastructure/scripts/db_local.sh
          DB_ROLE= python manage.py migrate --noinput
          psql "$PGURL" -c "GRANT TRUNCATE ON ALL TABLES IN SCHEMA django TO app_backend"  # pytest-django flush (CI only)
          DB_ROLE= python manage.py check --deploy --fail-level ERROR || true
      - name: Unit + integration tests (multi-tenant isolation, traceability)
        run: RUN_INTEGRATION=1 pytest -q --cov=apps --cov-report=term-missing

  frontend:
    name: Frontend lint, typecheck, tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t growth-ia-backend .
      - run: docker build -t growth-ia-frontend frontend
